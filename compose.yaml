name: sabnzbd

x-daemonless:
  title: "SABnzbd"
  icon: ":material-download-network:"
  category: "Downloaders"
  description: "Free and easy binary newsreader that automates the downloading and processing of Usenet content."
  upstream_url: "https://github.com/sabnzbd/sabnzbd"
  web_url: "https://sabnzbd.org/"
  freshports_url: "https://www.freshports.org/news/sabnzbd/"
  user: "bsd"
  mlock: false
  appjail: true
  # fjord fills these with the names a names provider gives the app:
  # SABnzbd refuses a name not on its host_whitelist.
  name_env:
    HOST_ALLOWLIST: "{names}"

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      HOST_ALLOWLIST: "Extra names SABnzbd answers to, comma-separated; added to its host_whitelist at every start (HOST_WHITELIST also works)"
    volumes:
      /config: "Configuration directory"
      /downloads: "Download directory"
    ports:
      8080: "Web UI"

services:
  sabnzbd:
    image: ghcr.io/daemonless/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC

    volumes:
      - /path/to/containers/sabnzbd:/config
      - /path/to/downloads:/downloads

    ports:
      - 8080:8080
